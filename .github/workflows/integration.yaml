name: Integration

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-change-scope:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-change-scope.yaml
    with:
      doc-paths: '["AGENTS.md","CHANGELOG.md","CLAUDE.md","LICENSE","docs/development/ci-change-scope.md"]'
      doc-prefixes: '[]'
      runner: '["self-hosted","ubuntu-latest"]'

  lint-actions:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run actionlint
        uses: rhysd/actionlint@v1.7.12

  lint-dockerfile:
    name: hadolint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - Dockerfile
          - .devcontainer/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run hadolint on ${{ matrix.dockerfile }}
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: ${{ matrix.dockerfile }}

  lint-python:
    name: uv + ruff
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Sync project (lockfile check)
        run: uv sync --frozen

      - name: Format check (ruff)
        run: uvx ruff format --check .

      - name: Lint (ruff)
        run: uvx ruff check .

  build-smoke:
    if: ${{ !cancelled() && (true) }}
    needs: ["ci-change-scope"]
    name: docker build smoke (no push)
    runs-on: ${{ fromJSON((needs['ci-change-scope'].result == 'success' && needs['ci-change-scope'].outputs.docs_only == 'true') && '["self-hosted","ubuntu-latest"]' || '"ubuntu-latest"') }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        uses: actions/checkout@v6

      - name: Set up QEMU
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        uses: docker/setup-buildx-action@v4

      - name: Build image (linux/amd64, no push)
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: gamdl:ci
          cache-from: type=gha,scope=smoke
          cache-to: type=gha,mode=max,scope=smoke

      - name: Docs-only exemption
        if: ${{ needs['ci-change-scope'].result == 'success' && needs['ci-change-scope'].outputs.docs_only == 'true' }}
        shell: bash
        working-directory: .
        env:
          CI_CHANGE_REASON: ${{ needs['ci-change-scope'].outputs.reason }}
        run: |
          printf '%s\n' "$CI_CHANGE_REASON" >> "$GITHUB_STEP_SUMMARY"
  commitlint:
    name: Commit Lint
    runs-on: ubuntu-latest
    if: github.event.action != 'closed' || github.event.pull_request.merged != true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install commitlint
        run: |
          bun install conventional-changelog-conventionalcommits
          bun install @commitlint/config-conventional@latest
          bun install commitlint@latest
      - name: Validate PR commits
        if: github.event_name == 'pull_request'
        run: |
          bunx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose
      - name: Validate last commit
        if: github.event_name == 'push'
        run: bunx commitlint --last --verbose

  typecheck:
    if: ${{ !cancelled() && (true) }}
    needs: ["ci-change-scope"]
    name: mypy
    runs-on: ${{ fromJSON((needs['ci-change-scope'].result == 'success' && needs['ci-change-scope'].outputs.docs_only == 'true') && '["self-hosted","ubuntu-latest"]' || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v5
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
      - uses: astral-sh/setup-uv@v6
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        with:
          enable-cache: true
      - name: Install dependencies
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        run: uv sync --frozen
      # Uncomment when the project uses Prisma (or similar codegen).
      # - name: Generate Prisma client
      #   run: uv run prisma generate
      - name: mypy
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        run: uv run mypy .

      - name: Docs-only exemption
        if: ${{ needs['ci-change-scope'].result == 'success' && needs['ci-change-scope'].outputs.docs_only == 'true' }}
        shell: bash
        working-directory: .
        env:
          CI_CHANGE_REASON: ${{ needs['ci-change-scope'].outputs.reason }}
        run: |
          printf '%s\n' "$CI_CHANGE_REASON" >> "$GITHUB_STEP_SUMMARY"
  test:
    if: ${{ !cancelled() && (true) }}
    needs: ["ci-change-scope"]
    name: pytest
    runs-on: ${{ fromJSON((needs['ci-change-scope'].result == 'success' && needs['ci-change-scope'].outputs.docs_only == 'true') && '["self-hosted","ubuntu-latest"]' || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v5
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
      - uses: astral-sh/setup-uv@v6
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        with:
          enable-cache: true
      - name: Install dependencies
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        run: uv sync --frozen
      # Uncomment when the project uses Prisma (or similar codegen).
      # - name: Generate Prisma client
      #   run: uv run prisma generate
      - name: pytest
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        run: uv run pytest

      - name: Docs-only exemption
        if: ${{ needs['ci-change-scope'].result == 'success' && needs['ci-change-scope'].outputs.docs_only == 'true' }}
        shell: bash
        working-directory: .
        env:
          CI_CHANGE_REASON: ${{ needs['ci-change-scope'].outputs.reason }}
        run: |
          printf '%s\n' "$CI_CHANGE_REASON" >> "$GITHUB_STEP_SUMMARY"
