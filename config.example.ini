# Kanade / gamdl configuration template.
#
# Copy this file to `config.ini` (which is gitignored) and edit as needed:
#   cp config.example.ini config.ini
#
# Values shown are the defaults Kanade ships with — they are tuned for the
# bundled Docker Compose stack (wrapper-v2 sidecar on http://wrapper:80, ALAC,
# nm3u8DL-RE download mode). Every key here maps 1:1 to a gamdl CLI flag; see
# `gamdl --help` or https://github.com/glomatico/gamdl for the upstream docs.

[gamdl]
# ----------------------------------------------------------------------------
# Wrapper-v2 (FairPlay decryption + Apple account)
# ----------------------------------------------------------------------------
# Route account, playback and decryption requests through a wrapper-v2 sidecar
# instead of requiring a local .wvd file. Required for ALAC / lossless.
use_wrapper = true
wrapper_url = http://wrapper:80

# Path to a Widevine .wvd device file. Only needed when use_wrapper = false.
wvd_path = null

# ----------------------------------------------------------------------------
# Authentication
# ----------------------------------------------------------------------------
# Netscape-format cookies exported from an Apple Music web session.
# Mounted into the container at /app/cookies.txt by docker-compose.
cookies_path = ./cookies.txt

# ----------------------------------------------------------------------------
# Artist downloads — IMPORTANT for Kanade's queue worker
# ----------------------------------------------------------------------------
# When a request comes in via POST /api/queues with `artist_id`, gamdl would
# normally show an interactive prompt asking which subset to download. The
# worker has no TTY, so this MUST be set to a non-interactive value or the
# job will hang forever.
#
# Valid values:
#   main-albums         — studio albums only
#   compilation-albums  — compilations
#   live-albums         — live releases
#   singles-eps         — singles & EPs
#   all-albums          — everything above (recommended for Kanade)
#   top-songs           — top tracks only (no full albums)
#   music-videos        — music videos only
artist_auto_select = all-albums

# ----------------------------------------------------------------------------
# Output layout
# ----------------------------------------------------------------------------
# Root directory for finished downloads. Mounted to ./content on the host
# by the default compose file.
output_path = ./content

# Scratch directory for in-progress segments. Cleared after each track.
temp_path = .

# Folder/file naming templates. Tokens: {album_artist}, {album}, {artist},
# {title}, {disc}, {track}, {playlist_artist}, {playlist_title}.
album_folder_template = {album_artist}/{album}
compilation_folder_template = Compilations/{album}
no_album_folder_template = {artist}/Unknown Album
playlist_folder_template = Playlists/{playlist_artist}
single_disc_file_template = {track:02d} {title}
multi_disc_file_template = {disc}-{track:02d} {title}
no_album_file_template = {title}
playlist_file_template = Playlists/{playlist_artist}/{playlist_title}

# Truncate filenames to this many characters (`null` disables).
truncate = null

# ----------------------------------------------------------------------------
# Audio
# ----------------------------------------------------------------------------
# Codec priority (comma-separated). Picks the first one the API offers.
# Common values: alac, aac, aac-he, aac-binaural, aac-downmix, ec3, ac3,
#                atmos, ask.
song_codec_piority = alac

# Download backend.  `nm3u8dlre` is fast and resumable; `aria2c`, `curl`,
# `yt-dlp` and `requests` are also accepted.
download_mode = nm3u8dlre

# ----------------------------------------------------------------------------
# Music videos
# ----------------------------------------------------------------------------
music_video_codec_priority = h264,h265
music_video_resolution = 1080p
music_video_remux_format = m4v
uploaded_video_quality = best

# ----------------------------------------------------------------------------
# Lyrics & cover art
# ----------------------------------------------------------------------------
# Synced lyrics are embedded by default; set true to skip them entirely or
# `synced_lyrics_only = true` to download nothing but .lrc files.
no_synced_lyrics = false
synced_lyrics_only = false
synced_lyrics_format = lrc

# Save cover art as a separate file alongside the audio (in addition to
# embedding it in the tags).
save_cover = false
cover_format = jpg
cover_size = 1200

# ----------------------------------------------------------------------------
# Metadata
# ----------------------------------------------------------------------------
# Two-letter language code for Apple Music metadata (track titles, artist
# names, etc).
language = ja-JP

# Date format applied to the release-date tag.
date_tag_template = %Y-%m-%dT%H:%M:%SZ

# Use the album release date for every song on the album (instead of the
# per-song release date).
use_album_date = false

# Comma-separated tag names to strip from the output file (`null` keeps all).
exclude_tags = null

# ----------------------------------------------------------------------------
# Misc behavior
# ----------------------------------------------------------------------------
# Overwrite existing files. Kanade's POST /api/queues also accepts
# `{"options": {"overwrite": true}}` per-request, which is usually preferable.
overwrite = false

# Save the M3U8 playlist file for downloaded playlists.
save_playlist = false

# Optional SQLite database where gamdl itself records downloaded media.
# Kanade uses PostgreSQL via DATABASE_URL for dedup, so this can stay null.
database_path = null

# Don't raise exceptions for partial failures (per-track errors won't
# abort the album).
no_exceptions = false

# ----------------------------------------------------------------------------
# Logging & tool paths
# ----------------------------------------------------------------------------
log_level = INFO
log_file = null

# Executables. The Kanade Docker image installs both on PATH so the bare
# names below are sufficient inside the container.
nm3u8dlre_path = N_m3u8DL-RE
ffmpeg_path = ffmpeg
