[project]
name = "kanade"
version = "0.1.3"
description = "Apple Music Helper"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bullmq>=2.0.0",
    "flask>=3.0.0",
    "flask-cors>=5.0.0",
    "gamdl>=2.9.2",
    "gunicorn>=23.0.0",
    "pyplayready>=0.8.3",
    "pywidevine>=1.9.0",
    "pyyaml>=6.0",
    "requests>=2.32.5",
]

[dependency-groups]
dev = ["pytest>=9.0.2"]
