[project]
name = "kanade"
version = "0.2.0"
description = "Apple Music Helper"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bullmq>=2.0.0",
    "flask>=3.0.0",
    "flask-cors>=5.0.0",
    "gamdl>=3.7.3",
    "gunicorn>=23.0.0",
    "psycopg[binary]>=3.2.0",
]

[dependency-groups]
dev = [
    "mypy>=0.0",
    "ruff>=0.0","pytest>=9.0.2"]

[tool.mypy]
ignore_missing_imports = true
explicit_package_bases = true
no_implicit_optional = false
check_untyped_defs = false
warn_no_return = false
disable_error_code = ["import-untyped", "assignment", "operator", "arg-type", "return-value", "attr-defined", "index", "call-overload", "var-annotated", "union-attr", "call-arg", "return", "has-type", "misc", "name-defined", "literal-required", "no-redef", "unreachable"]
